<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gemini — Software Engineering Studio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gemini builds native iOS and Android apps, web platforms, backends and AI automation for ambitious teams.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Gemini — Software Engineering Studio">
  <meta property="og:description" content="Mobile apps, web platforms, robust backends and AI systems — engineered end to end.">
  <meta property="og:image" content="https://gemini.dev/assets/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Gemini — Software Engineering Studio">
  <meta name="twitter:description" content="Mobile apps, web platforms, robust backends and AI systems — engineered end to end.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f0ec">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- The scheme has to be resolved before the first paint, otherwise a reader
       arriving at night sees a white page flash before the app boots. This runs
       the same rule the app does — a stored choice wins, and failing that the
       hour of the day and the OS preference decide — and writes the answer to
       <html data-theme>, which is what the stylesheet keys off. Kept inline and
       dependency-free on purpose: it must not wait for a network round trip. -->
  <script>
    (function () {
      var DAY_STARTS_AT = 7;
      var DAY_ENDS_AT = 19;

      var stored = null;
      try {
        stored = localStorage.getItem('gemini-theme');
      } catch (error) {
        // Private mode or storage disabled — fall through to the automatic rule.
      }

      var hour = new Date().getHours();
      var night = hour < DAY_STARTS_AT || hour >= DAY_ENDS_AT;
      var systemDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

      var dark = stored === 'dark' || (stored !== 'light' && (night || systemDark));
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');

      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) {
        meta.setAttribute('content', dark ? '#100f0d' : '#f2f0ec');
      }
    })();
  </script>

  <!-- Archivo is the grotesk the whole page is set in: one variable file covers
       400-700, so hierarchy comes from weight and size rather than from extra
       downloads. IBM Plex Mono carries labels, figures and the code specimen. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
