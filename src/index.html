<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Gemini — AI-native software and automation studio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Gemini combines frontier AI, autonomous agents and automation to turn hard problems into systems that run themselves — delivered faster and at lower cost.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://geminiswe.com/">
  <meta property="og:title" content="Gemini — AI-native software and automation studio">
  <meta property="og:description" content="We make hard problems disappear. AI agents, automation and intelligent products — delivered in weeks, not quarters.">
  <meta property="og:image" content="https://geminiswe.com/assets/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Gemini — AI-native software and automation studio">
  <meta name="twitter:description" content="We make hard problems disappear. AI agents, automation and intelligent products — delivered in weeks, not quarters.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0d2c">
  <link rel="canonical" href="https://geminiswe.com/">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=gemini-g2" sizes="16x16 32x32 48x48 64x64">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/gemini-icon-32.png?v=2">
  <link rel="icon" type="image/svg+xml" sizes="any" href="assets/gemini-icon.svg?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=2">

  <!-- Deployment-specific settings, loaded before Angular boots. Neither file
       holds a secret: a public PostHog project token and the public endpoint
       the project form posts to. -->
  <script src="assets/analytics-config.js"></script>
  <script src="assets/contact-config.js"></script>

  <!-- The scheme is resolved before first paint so nobody sees the wrong one
       flash. Same rule as ThemeService: a stored choice wins; otherwise night
       hours or a dark OS mean dark. Keep DAY_STARTS_AT / DAY_ENDS_AT and the
       two colours in sync with theme.service.ts and styles.scss. -->
  <script>
    (function () {
      var DAY_STARTS_AT = 7;
      var DAY_ENDS_AT = 19;

      var stored = null;
      try {
        stored = localStorage.getItem('gemini-theme');
      } catch (error) {
        // Storage disabled — fall through to the automatic rule.
      }

      var hour = new Date().getHours();
      var night = hour < DAY_STARTS_AT || hour >= DAY_ENDS_AT;
      var systemDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

      var dark = stored === 'dark' || (stored !== 'light' && (night || systemDark));
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');

      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) {
        meta.setAttribute('content', dark ? '#0a0d2c' : '#f3f4fb');
      }
    })();
  </script>

  <!-- Mona Sans is the only typeface: one variable file with weight and width
       axes. Width is used expressively — condensed for problems, expanded for
       outcomes — so a single download carries the whole hierarchy. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,200..900&display=swap">
</head>
<body>
  <app-root></app-root>
  <noscript>
    <style>.reveal { opacity: 1 !important; transform: none !important; }</style>
  </noscript>
</body>
</html>
