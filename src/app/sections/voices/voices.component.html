<section class="section voices" aria-labelledby="voices-title">
  <div class="page head-row">
    <header class="section-head" appReveal>
      <h2 class="section-title" id="voices-title">{{ t().voices.title }}</h2>
      <p class="section-copy">{{ t().voices.copy }}</p>
    </header>

    <div class="controls">
      <button
        type="button"
        class="control"
        [disabled]="atStart()"
        [attr.aria-label]="t().voices.previous"
        (click)="page(-1)"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.5 6 8.5 12l6 6" />
        </svg>
      </button>
      <button
        type="button"
        class="control"
        [disabled]="atEnd()"
        [attr.aria-label]="t().voices.next"
        (click)="page(1)"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9.5 6 6 6-6 6" />
        </svg>
      </button>
    </div>
  </div>

  <ul class="track" #track tabindex="0" [attr.aria-label]="t().voices.title">
    @for (quote of t().voices.quotes; track quote.client) {
    <li class="quote">
      <figure>
        <blockquote><q>{{ quote.text }}</q></blockquote>
        <p class="impact"><span class="flow-text">{{ quote.impact }}</span></p>
        <figcaption>
          <span class="quote-client">{{ quote.client }}</span>
          <span class="quote-role">{{ quote.role }}</span>
        </figcaption>
      </figure>
    </li>
    }
  </ul>
</section>
